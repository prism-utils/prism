# Target config shape (YAML). YAML loading lands in Phase 1 (koanf yaml→json
# shim + ${ENV} interpolation, docs/PLAN.md); until then use the JSON example
# with `prism validate -c examples/prism.example.json`.
#
# Every stage is `type` (which component) + `options` (that component's block).
input:
  type: file
  options:
    path: /var/log/app.log
    mode: tail                # tail | batch | (stdin has its own input type)

parser:
  type: logfmt                # json | logfmt | regex | template
  options:
    autodiscover_fields: true

processors:                   # run in this exact order
  - type: summary
    options:
      window: 30s
      group_by: [level, service]
      aggregates: [count, "p95(latency)"]
  - type: ml
    options:
      enabled: true           # toggle a built-in off without removing it
      detector: anomaly
      sensitivity: 0.95
  - type: script
    options:
      engine: starlark
      source_file: enrich.star

encoder:
  type: parquet
  options:
    compression: zstd
    row_group_rows: 50000

output:
  type: http
  options:
    url: https://sink.example/ingest
    method: POST
    headers:
      Authorization: "Bearer ${PRISM_TOKEN}"   # secret from env, safe to commit
    retry:
      max_attempts: 5
      backoff: exponential
