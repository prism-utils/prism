# Reference pipeline: MongoDB exporter -> prism -> tenant proxy (Flight).
# See configs/exporters/elasticsearch.yaml for the env/usage contract.
#
# Env expected:
#   MONGODB_EXPORTER_URL  e.g. http://127.0.0.1:9216/metrics
#   TENANT_FLIGHT_ADDR, AGENT_API_KEY, TENANT_SERVER_NAME
pipelines:
  - name: mongodb
    input:
      type: prometheus
      options:
        targets: ["${MONGODB_EXPORTER_URL}"]
        interval: 15s
    parser:
      type: prometheus
    buffer:
      max_age: 30s
      max_bytes: 12MiB
    branches:
      - name: raw
        encoder: { type: arrow }
        output:
          type: flight
          options:
            addr: "${TENANT_FLIGHT_ADDR}"
            token: "${AGENT_API_KEY}"
            tls: { server_name: "${TENANT_SERVER_NAME}" }
