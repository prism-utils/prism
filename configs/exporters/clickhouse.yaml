# Reference pipeline: ClickHouse exporter -> prism -> tenant proxy (Flight).
# See configs/exporters/elasticsearch.yaml for the env/usage contract.
#
# ClickHouse exposes Prometheus metrics on its own port (default 9363) at
# /metrics. Point CLICKHOUSE_METRICS_URL at that full path (a common footgun is
# scraping host:9363 without /metrics — always include the path).
#
# Env expected:
#   CLICKHOUSE_METRICS_URL  e.g. http://127.0.0.1:9363/metrics
#   TENANT_FLIGHT_ADDR, AGENT_API_KEY, TENANT_SERVER_NAME
pipelines:
  - name: clickhouse
    input:
      type: prometheus
      options:
        targets: ["${CLICKHOUSE_METRICS_URL}"]
        interval: 15s
    parser:
      type: prometheus
    buffer:
      max_age: 30s
      max_bytes: 12MiB
    branches:
      - name: raw
        encoder: { type: arrow }
        output:
          type: flight
          options:
            addr: "${TENANT_FLIGHT_ADDR}"
            token: "${AGENT_API_KEY}"
            tls: { server_name: "${TENANT_SERVER_NAME}" }
