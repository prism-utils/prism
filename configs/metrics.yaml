# Metrics pipeline: scrape a Prometheus /metrics endpoint and persist the raw
# series as time-range-named Parquet. No summary branch — server-side analytics
# aggregate the columnar Parquet directly (cheaper than pre-aggregating here).
#
#   prism run -config configs/metrics.yaml
#
# Environment:
#   PRISM_METRICS_URL  the /metrics endpoint to scrape (e.g. http://host:9100/metrics)
#   PRISM_OUT          output root directory
pipelines:
  - name: metrics
    input:
      type: prometheus
      options:
        targets: ["${PRISM_METRICS_URL}"]
        interval: "1s"
    parser: { type: prometheus }
    buffer:
      max_age: "5s"
      max_bytes: "12MiB"
    branches:
      # phase: raw — one Parquet file per window, named
      # metrics-raw-<start>-<end>-<seq>.parquet
      - name: raw
        encoder: { type: parquet, options: { compression: snappy } }
        output: { type: dir, options: { dir: "${PRISM_OUT}/metrics/raw" } }
