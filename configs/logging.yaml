# Logging pipeline in three phases, each a time-range-named Parquet artifact:
#   raw       — parsed log records as-is
#   template  — records plus a mined, stable log template column
#   summary   — count per log template (for charts: "template X → count Y")
#
#   prism run -config configs/logging.yaml
#
# Environment:
#   PRISM_LOG   the log file to tail
#   PRISM_OUT   output root directory
pipelines:
  - name: logs
    input:
      type: file
      options:
        path: "${PRISM_LOG}"
        mode: tail
        batch_size: 500
    parser: { type: logfmt }
    buffer:
      max_age: "2s"
      max_bytes: "12MiB"
    branches:
      # phase: raw — records exactly as parsed, no template column.
      - name: raw
        encoder: { type: parquet, options: { compression: snappy } }
        output: { type: dir, options: { dir: "${PRISM_OUT}/logs/raw" } }
      # phase: template — records plus the mined template column.
      - name: template
        processors:
          - type: template
            options: { source: msg, target: template }
        encoder: { type: parquet, options: { compression: snappy } }
        output: { type: dir, options: { dir: "${PRISM_OUT}/logs/template" } }
      # phase: summary — count per template, as Parquet.
      - name: summary
        processors:
          - type: template
            options: { source: msg, target: template }
          - type: summary
            options: { group_by: ["template"], aggregates: ["count"] }
        encoder: { type: parquet, options: { compression: snappy } }
        output: { type: dir, options: { dir: "${PRISM_OUT}/logs/summary" } }
