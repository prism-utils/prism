# Example Traefik IngressRoute — consumer overlay, not part of helm template output.
# Routes public ingest only; admin plane stays cluster-internal (see values-overlay.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prism-store-ingest
  namespace: prism-store
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`store.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: prism-store
          port: 8080
  tls:
    secretName: store-example-com-tls
