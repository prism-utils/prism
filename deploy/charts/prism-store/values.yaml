# Default profile: aggregate ingest ≤ 1k samples/s (see Sizing table below).
#
# Recommended defaults by aggregate ingest rate (central pod, 15d retention):
# | Aggregate ingest | cpu req | cpu limit | mem req | mem limit | HOT_WINDOW | MAX_SEGMENT_BYTES | PVC (15d) |
# |------------------|---------|-----------|---------|-----------|------------|-------------------|-----------|
# | ≤ 1k samples/s   | 250m    | 2         | 512Mi   | 2Gi       | 10m        | 1Gi               | 32Gi      |
# | 1–5k/s           | 500m    | 3         | 1Gi     | 3Gi       | 5m         | 1Gi               | 128Gi     |
# | 5–15k/s          | 1       | 4         | 2Gi     | 6Gi       | 3m         | 512Mi             | 512Gi     |
# | 15–40k/s         | 2       | 6         | 4Gi     | 10Gi      | 2m         | 512Mi             | 1Ti+      |
#
# Sizing ratios (metrics-raw, zstd Parquet; measured on prod node sunset):
#   CPU (ingest):  ≈ 0.013 cores per 1,000 samples/s sustained. Merges are bursty — size
#                  the limit, not the request, for merge headroom.
#   Memory:        mem ≈ 128 MiB + (ingest_rate × HOT_WINDOW_seconds × ~0.4 KiB/row) × ~1.5
#                  Example: 5,000 samples/s @ 5-min hot window ≈ ~1 GiB (not ~10 MB — DuckDB
#                  hot-window + arena dominate; a flat "10 MB/5k/s" rule is ~100× too low).
#   Storage:       ≈ 95 bytes/sample × rate × retention_days × 86,400 × ~1.3 (rollups+overhead).
#                  Example: 1,000 samples/s × 15 d ≈ ~160 GiB before overhead discounts.
#   Levers:        shrink HOT_WINDOW at high rates; cap MAX_SEGMENT_BYTES (512 MiB–1 GiB) to
#                  bound transient merge RAM.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/elk-utilities/prism-store
  # Empty tag defaults to Chart.appVersion at render time.
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  name: ""

podLabels: {}
podAnnotations: {}

# DuckDB is a single writer: replicas MUST stay at 1 and the RWO PVC must never be
# mounted by two pods (StatefulSet + volumeClaimTemplates enforces stable PVC identity).
replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

persistence:
  enabled: true
  # Future: split hot (SSD) and cold (HDD) tiers on separate volumes; today one PVC covers all.
  storageClass: ""
  size: 32Gi
  accessModes:
    - ReadWriteOnce

env:
  listenAddr: ":8080"
  # Empty adminListenAddr keeps ingest + admin + health on LISTEN_ADDR (combined plane).
  adminListenAddr: ""
  flightAddr: ""
  dataDir: "/data"
  allowedArtifacts: "metrics-raw"
  maxBodyBytes: "268435456"
  authMode: "none"
  routePrefix: ""
  hotWindowMinutes: "10"
  # When set, overrides hotWindowMinutes (seconds).
  hotWindowSeconds: ""
  segmentsPerTier: "6"
  maxSegmentBytes: "2147483648"
  retentionDays: "15"
  rollupSteps: "1m,5m,1h"
  maxTier: "8"
  hotSnapshotSeconds: "15"
  flushTickSeconds: "30"
  mergeTickSeconds: "60"
  retentionTickHours: "1"
  # When set, overrides retentionTickHours (seconds).
  retentionTickSeconds: ""

  sqlAPIEnabled: "true"
  sqlAPIMaxRows: "100000"
  sqlAPITimeoutSeconds: "30"
  sqlAPIMaxBodyBytes: "1048576"

# Tokens are never inlined here. Point existingSecret at a pre-created Secret; the chart
# does not create or rotate credentials (no ESO/SealedSecrets dependency).
secrets:
  existingSecret: ""
  ingestTokenKey: ingest-token
  adminTokenKey: admin-token

service:
  type: ClusterIP
  annotations: {}

networkPolicy:
  enabled: false
  ingest:
    namespaceSelector: {}
    podSelector: {}
  admin:
    namespaceSelector: {}
    podSelector: {}

# RBAC (JWT/OIDC + mounted policy). Default off — enable for multi-tenant isolation.
rbac:
  enabled: false
  policy: |
    bindings: []
  policyMountPath: /etc/prism/rbac
  oidc:
    issuer: ""
    audience: ""
    jwksURL: ""
    jwksFile: ""
  reloadSeconds: "15"
