apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prism-alert.fullname" . }}
  labels:
    {{- include "prism-alert.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prism-alert.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prism-alert.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.rulesConfigMap }}
        # Roll pods when the rendered rule set changes so new rules load without
        # waiting for the kubelet's ConfigMap propagation + a manual restart.
        checksum/rules: {{ toYaml .Values.rules | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "prism-alert.serviceAccountName" . }}
      # The ruler never calls the Kubernetes API; don't mount a SA token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prism-alert
          image: {{ include "prism-alert.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ include "prism-alert.publicPort" . }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.env.listenAddr | quote }}
            - name: STORE_BASE_URL
              value: {{ .Values.env.storeBaseURL | quote }}
            - name: TENANT_NS
              value: {{ .Values.env.tenantNS | quote }}
            {{- if .Values.env.routePrefix }}
            - name: ROUTE_PREFIX
              value: {{ .Values.env.routePrefix | quote }}
            {{- end }}
            - name: QUERY_HOT_ONLY
              value: {{ .Values.env.queryHotOnly | quote }}
            - name: NOTIFIER_WEBHOOK_URL
              value: {{ .Values.env.notifierWebhookURL | quote }}
            - name: RECEIVER
              value: {{ .Values.env.receiver | quote }}
            {{- if .Values.env.externalURL }}
            - name: EXTERNAL_URL
              value: {{ .Values.env.externalURL | quote }}
            {{- end }}
            - name: RULES_DIR
              value: {{ .Values.env.rulesDir | quote }}
            - name: EVALUATION_INTERVAL
              value: {{ .Values.env.evaluationInterval | quote }}
            - name: GROUP_BY
              value: {{ .Values.env.groupBy | quote }}
            - name: GROUP_WAIT
              value: {{ .Values.env.groupWait | quote }}
            - name: GROUP_INTERVAL
              value: {{ .Values.env.groupInterval | quote }}
            - name: REPEAT_INTERVAL
              value: {{ .Values.env.repeatInterval | quote }}
            - name: RESOLVE_TIMEOUT
              value: {{ .Values.env.resolveTimeout | quote }}
            {{- if and .Values.secrets.existingSecret .Values.secrets.storeTokenSecretKey }}
            - name: STORE_TOKEN_FILE
              value: {{ printf "%s/%s" .Values.secrets.storeTokenMountPath .Values.secrets.storeTokenFileName | quote }}
            {{- end }}
            {{- if .Values.secrets.existingSecret }}
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: {{ .Values.secrets.webhookSecretKey | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "prism-alert.hasRules" . }}
            - name: rules
              mountPath: {{ .Values.env.rulesDir }}
              readOnly: true
            {{- end }}
            {{- if and .Values.secrets.existingSecret .Values.secrets.storeTokenSecretKey }}
            - name: store-token
              mountPath: {{ .Values.secrets.storeTokenMountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if include "prism-alert.hasRules" . }}
        - name: rules
          configMap:
            name: {{ include "prism-alert.rulesConfigMapName" . }}
        {{- end }}
        {{- if and .Values.secrets.existingSecret .Values.secrets.storeTokenSecretKey }}
        - name: store-token
          secret:
            secretName: {{ .Values.secrets.existingSecret | quote }}
            items:
              - key: {{ .Values.secrets.storeTokenSecretKey | quote }}
                path: {{ .Values.secrets.storeTokenFileName | quote }}
        {{- end }}
