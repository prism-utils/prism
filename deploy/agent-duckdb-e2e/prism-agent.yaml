# prism agent: scrape → duckdb encode → HTTP ingest (application/vnd.duckdb).
pipelines:
  - name: node
    input:
      type: prometheus
      options:
        targets:
          - "http://node-exporter:9100/metrics"
        interval: "2s"
        timeout: "3s"
    parser:
      type: prometheus
    buffer:
      max_age: "2s"
      max_rows: 100000
      max_bytes: "16MiB"
    branches:
      - name: store
        encoder:
          type: duckdb
        output:
          type: http
          options:
            url: "http://prism-store:9090/agentduck/ingest/metrics-raw"
            method: "POST"
