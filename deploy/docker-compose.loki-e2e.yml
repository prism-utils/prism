# Full-stack logs end-to-end on the reader/writer topology: the prism agent tails
# a log fixture and ships logs windows to the writer store, and a second store
# instance serves the same files as a read-only reader (no background jobs,
# hot-only queries) over /sql and the Loki-compatible API.
# Reproduce with `make loki-e2e`.
services:
  # Writer: owns the data dir, accepts logs ingest, runs lifecycle jobs.
  prism-store-writer:
    build:
      context: ..
      dockerfile: Dockerfile.store.build
    environment:
      LISTEN_ADDR: "0.0.0.0:9090"
      DATA_DIR: "/data"
      ALLOWED_ARTIFACTS: "metrics-raw,logs-raw,logs-summary"
      AUTH_MODE: "none"
      RUN_JOBS: "true"
      LOKI_API_ENABLED: "true"
      HOT_SNAPSHOT_SECONDS: "2"
      FLUSH_TICK_SECONDS: "2"
    volumes:
      - logs-data:/data
    ports:
      - "19091:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 40

  # Reader: the homelab `prism-cache` shape — read-only mount of the writer's
  # data dir, no lifecycle jobs, hot-only metrics queries. Logs are file-backed,
  # so they stay fully readable here.
  prism-store-reader:
    build:
      context: ..
      dockerfile: Dockerfile.store.build
    depends_on:
      prism-store-writer:
        condition: service_healthy
    environment:
      LISTEN_ADDR: "0.0.0.0:9090"
      DATA_DIR: "/data"
      AUTH_MODE: "none"
      RUN_JOBS: "false"
      QUERY_HOT_ONLY: "true"
      SQL_API_ENABLED: "true"
      LOKI_API_ENABLED: "true"
    volumes:
      - logs-data:/data:ro
    ports:
      - "19092:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 40

  # Agent: tail a log fixture → logs parser → parquet → writer ingest.
  prism-agent:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      prism-store-writer:
        condition: service_healthy
    volumes:
      - ./loki-e2e/prism-agent.yaml:/etc/prism/prism.yaml:ro
      - ./loki-e2e/app.log:/var/log/app/app.log:ro

volumes:
  logs-data:
