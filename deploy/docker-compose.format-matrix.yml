# Format matrix: prism-store with configurable HOT_SEGMENT_FORMAT ×
# MERGE_SEGMENT_FORMAT. Driven by `make format-matrix-e2e` which loops the four
# combos and runs test/e2e/format_matrix_e2e_test.go against this compose file.
services:
  prism-store:
    build:
      context: ..
      dockerfile: Dockerfile.store.build
    environment:
      LISTEN_ADDR: "0.0.0.0:9090"
      DATA_DIR: "/data"
      ALLOWED_ARTIFACTS: "metrics-raw,logs-raw,logs-summary"
      AUTH_MODE: "none"
      RUN_JOBS: "true"
      SQL_API_ENABLED: "true"
      PROMQL_API_ENABLED: "true"
      LOKI_API_ENABLED: "true"
      HOT_SNAPSHOT_SECONDS: "2"
      FLUSH_TICK_SECONDS: "2"
      MERGE_TICK_SECONDS: "2"
      HOT_WINDOW_SECONDS: "2"
      SEGMENTS_PER_TIER: "2"
      LOGS_REFRESH_INTERVAL: "2"
      HOT_SEGMENT_FORMAT: "${HOT_SEGMENT_FORMAT:-parquet}"
      MERGE_SEGMENT_FORMAT: "${MERGE_SEGMENT_FORMAT:-parquet}"
      DUCKDB_STORAGE_VERSION: "${DUCKDB_STORAGE_VERSION:-v1.0.0}"
    volumes:
      - format-data:/data
    ports:
      - "19093:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 2s
      timeout: 2s
      retries: 40

volumes:
  format-data:
