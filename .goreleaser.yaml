# GoReleaser config for prism. Runs only on a `v*` git tag (see
# .github/workflows/release.yml) — never on merge-to-main. It produces signed
# static binaries + checksums + SBOMs and signed multi-arch GHCR images for
# both prism (agent) and prism-store.
#
# Local dry run:  make snapshot   (builds everything, pushes nothing)
# Validate:       make release-check
version: 2

project_name: prism

before:
  hooks:
    - go mod tidy

builds:
  - id: prism
    main: ./cmd/prism
    binary: prism
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/elk-utilities/prism/internal/version.Version={{ .Version }}

  - id: prism-store
    main: ./cmd/prism-store
    binary: prism-store
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/elk-utilities/prism/internal/version.Version={{ .Version }}
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++

archives:
  - id: prism
    ids:
      - prism
    formats:
      - tar.gz
    name_template: "prism_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
  - id: prism-store
    ids:
      - prism-store
    formats:
      - tar.gz
    name_template: "prism-store_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

sboms:
  - id: archive-sbom
    artifacts: archive

signs:
  - id: checksum-keyless
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

dockers:
  - id: prism-amd64
    ids:
      - prism
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/elk-utilities/prism:{{ .Version }}-amd64"
      - "ghcr.io/elk-utilities/prism:sha-{{ .ShortCommit }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=prism"
      - "--label=org.opencontainers.image.source=https://github.com/elk-utilities/prism"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
  - id: prism-arm64
    ids:
      - prism
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile.release
    image_templates:
      - "ghcr.io/elk-utilities/prism:{{ .Version }}-arm64"
      - "ghcr.io/elk-utilities/prism:sha-{{ .ShortCommit }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=prism"
      - "--label=org.opencontainers.image.source=https://github.com/elk-utilities/prism"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
  - id: store-amd64
    ids:
      - prism-store
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile.store.release
    image_templates:
      - "ghcr.io/elk-utilities/prism-store:{{ .Version }}-amd64"
      - "ghcr.io/elk-utilities/prism-store:sha-{{ .ShortCommit }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=prism-store"
      - "--label=org.opencontainers.image.source=https://github.com/elk-utilities/prism"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
  - id: store-arm64
    ids:
      - prism-store
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile.store.release
    image_templates:
      - "ghcr.io/elk-utilities/prism-store:{{ .Version }}-arm64"
      - "ghcr.io/elk-utilities/prism-store:sha-{{ .ShortCommit }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=prism-store"
      - "--label=org.opencontainers.image.source=https://github.com/elk-utilities/prism"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"

docker_manifests:
  - name_template: "ghcr.io/elk-utilities/prism:{{ .Version }}"
    image_templates:
      - "ghcr.io/elk-utilities/prism:{{ .Version }}-amd64"
      - "ghcr.io/elk-utilities/prism:{{ .Version }}-arm64"
  - name_template: "ghcr.io/elk-utilities/prism:sha-{{ .ShortCommit }}"
    image_templates:
      - "ghcr.io/elk-utilities/prism:sha-{{ .ShortCommit }}-amd64"
      - "ghcr.io/elk-utilities/prism:sha-{{ .ShortCommit }}-arm64"
  - name_template: "ghcr.io/elk-utilities/prism:latest"
    image_templates:
      - "ghcr.io/elk-utilities/prism:{{ .Version }}-amd64"
      - "ghcr.io/elk-utilities/prism:{{ .Version }}-arm64"
  - name_template: "ghcr.io/elk-utilities/prism-store:{{ .Version }}"
    image_templates:
      - "ghcr.io/elk-utilities/prism-store:{{ .Version }}-amd64"
      - "ghcr.io/elk-utilities/prism-store:{{ .Version }}-arm64"
  - name_template: "ghcr.io/elk-utilities/prism-store:sha-{{ .ShortCommit }}"
    image_templates:
      - "ghcr.io/elk-utilities/prism-store:sha-{{ .ShortCommit }}-amd64"
      - "ghcr.io/elk-utilities/prism-store:sha-{{ .ShortCommit }}-arm64"
  - name_template: "ghcr.io/elk-utilities/prism-store:latest"
    image_templates:
      - "ghcr.io/elk-utilities/prism-store:{{ .Version }}-amd64"
      - "ghcr.io/elk-utilities/prism-store:{{ .Version }}-arm64"

docker_signs:
  - id: manifest-keyless
    cmd: cosign
    artifacts: manifests
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"
    output: true

release:
  github:
    owner: elk-utilities
    name: prism
  prerelease: auto
