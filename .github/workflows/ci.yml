name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  # Maintainer-only CI: untrusted / fork PRs do not run builds unless labeled ci:run.
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          # Always run on push to main.
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same-repo PRs are from branches that required push access — run CI.
          if [ "${HEAD_REPO}" = "${BASE_REPO}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fork / external PRs: require maintainer label ci:run (no untrusted builds).
          case ",${LABELS}," in
            *,ci:run,*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "CI skipped: fork/external PR — a maintainer must add the ci:run label after reviewing the diff."
          echo "run=false" >> "$GITHUB_OUTPUT"

  # Fast gate: lint + unit/golden tests with the race detector.
  fast:
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - name: tidy check
        run: make tidy
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0
      - name: lint
        run: make lint
      - name: test
        run: make test

  # Store DuckDB path: ingest → flush → query → stats through real engine I/O.
  store:
    needs: [authorize, fast]
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - name: store integration smoke
        run: make store-integration

  # Helm chart: lint, template variants, and golden manifest stability.
  chart:
    needs: authorize
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.4
      - name: helm lint
        run: |
          helm lint deploy/charts/prism-store
          helm lint deploy/charts/prism-alert
      - name: helm template variants
        run: |
          helm template test deploy/charts/prism-store >/dev/null
          helm template test deploy/charts/prism-store --set networkPolicy.enabled=true >/dev/null
          helm template test deploy/charts/prism-store --set env.adminListenAddr=":9090" >/dev/null
          helm template test deploy/charts/prism-store --set metrics.serviceMonitor.enabled=true >/dev/null
          helm template test deploy/charts/prism-alert >/dev/null
          helm template test deploy/charts/prism-alert --set networkPolicy.enabled=true >/dev/null
          helm template test deploy/charts/prism-alert --set secrets.existingSecret=alert-secrets --set secrets.storeTokenSecretKey=reader-jwt >/dev/null
      - name: golden snapshot
        run: |
          deploy/charts/prism-store/scripts/check-golden.sh
          deploy/charts/prism-alert/scripts/check-golden.sh

  # Merge-blocking gate: brings up docker-compose deps and runs integration+e2e.
  full:
    needs: [authorize, fast]
    if: needs.authorize.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - name: integration + e2e
        run: |
          make integration
          make e2e
