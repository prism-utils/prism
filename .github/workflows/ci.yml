name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Fast gate on every PR: lint + unit/golden tests with the race detector.
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: tidy check
        run: make tidy
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0
      - name: lint
        run: make lint
      - name: test
        run: make test

  # Store DuckDB path: ingest → flush → query → stats through real engine I/O.
  store:
    runs-on: ubuntu-24.04
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: store integration smoke
        run: make store-integration

  # Helm chart: lint, template variants, and golden manifest stability.
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.4
      - name: helm lint
        run: helm lint deploy/charts/prism-store
      - name: helm template variants
        run: |
          helm template test deploy/charts/prism-store >/dev/null
          helm template test deploy/charts/prism-store --set networkPolicy.enabled=true >/dev/null
          helm template test deploy/charts/prism-store --set env.adminListenAddr=":9090" >/dev/null
      - name: golden snapshot
        run: deploy/charts/prism-store/scripts/check-golden.sh

  # Merge-blocking gate: brings up docker-compose deps and runs integration+e2e.
  full:
    runs-on: ubuntu-24.04
    needs: fast
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: integration + e2e
        run: |
          make integration
          make e2e
