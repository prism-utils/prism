name: release

# Publish only on a SemVer tag — never on merge-to-main. CI (ci.yml) keeps main
# green; this workflow turns a `v*` tag into a signed release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push the image to GHCR
  id-token: write # keyless cosign signing via OIDC

jobs:
  # Supply-chain gate: build the release binary + image and fail the release if
  # Trivy finds HIGH/CRITICAL vulnerabilities, before anything is published.
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: build agent binary for scanning
        run: |
          mkdir -p scanctx
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags "-s -w -X github.com/elk-utilities/prism/internal/version.Version=${GITHUB_REF_NAME}" \
              -o scanctx/prism ./cmd/prism
      - name: build agent image for scanning
        run: docker build -f Dockerfile.release -t prism:scan scanctx
      - name: trivy agent image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prism:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: build store binary for scanning
        run: |
          mkdir -p scanctx-store
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags "-s -w -X github.com/elk-utilities/prism/internal/version.Version=${GITHUB_REF_NAME}" \
              -o scanctx-store/prism-store ./cmd/prism-store
      - name: build store image for scanning
        run: docker build -f Dockerfile.store.release -t prism-store:scan scanctx-store
      - name: trivy store image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: prism-store:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  release:
    needs: scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history + tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: docker/setup-qemu-action@v3 # arm64 emulation on the amd64 runner
      - uses: docker/setup-buildx-action@v3
      - name: install arm64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
