name: release

# Publish only on a SemVer tag — never on merge-to-main. CI (ci.yml) keeps main
# green; this workflow turns a `v*` tag into a signed release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets
  packages: write # push the image to GHCR
  id-token: write # keyless cosign signing via OIDC

jobs:
  # Supply-chain gate: build the release binary + image and fail the release if
  # Trivy finds HIGH/CRITICAL vulnerabilities, before anything is published.
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - name: install cross compilers (agent + store CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++
      - name: build agent binary for scanning
        run: |
          mkdir -p scanctx
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags "-s -w -X github.com/prism-utils/prism/internal/version.Version=${GITHUB_REF_NAME}" \
              -o scanctx/prism ./cmd/prism
      - name: build agent image for scanning
        run: docker build -f Dockerfile.release -t prism:scan scanctx
      - name: agent image runtime smoke (glibc/base skew gate)
        # Agent is CGO (duckdb encoder); same glibc floor as prism-store.
        run: |
          set -e
          docker run --rm --entrypoint /usr/local/bin/prism prism:scan version
      - name: trivy agent image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          image-ref: prism:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: build store binary for scanning
        run: |
          mkdir -p scanctx-store
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -tags duckdb_arrow \
              -ldflags "-s -w -X github.com/prism-utils/prism/internal/version.Version=${GITHUB_REF_NAME}" \
              -o scanctx-store/prism-store ./cmd/prism-store
      - name: build store image for scanning
        run: docker build -f Dockerfile.store.release -t prism-store:scan scanctx-store
      - name: store image runtime smoke (glibc/base skew gate)
        # The store binary is CGO (DuckDB) and links glibc at load time. A
        # build-vs-runtime glibc skew (e.g. binary built on glibc 2.39 shipped
        # on a base with 2.36) only surfaces when the image is *run*, not by
        # Trivy. Boot the image and require it to reach "listening"; fail the
        # release otherwise so a broken image is never published (see prism#59).
        run: |
          set -e
          docker run --rm -d --name prism-store-smoke prism-store:scan >/dev/null
          ok=""
          for _ in $(seq 1 20); do
            if docker logs prism-store-smoke 2>&1 | grep -q "prism-store listening"; then
              ok=1; break
            fi
            if [ -z "$(docker ps -q --filter name=prism-store-smoke)" ]; then
              break
            fi
            sleep 1
          done
          echo "----- store smoke logs -----"
          docker logs prism-store-smoke 2>&1 | tail -20 || true
          docker rm -f prism-store-smoke >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "::error::prism-store image failed to boot (glibc/base skew or startup error)"
            exit 1
          fi
          echo "store image booted OK on the release base"
      - name: trivy store image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          image-ref: prism-store:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: build alert binary for scanning
        run: |
          mkdir -p scanctx-alert
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
              -ldflags "-s -w -X github.com/prism-utils/prism/internal/version.Version=${GITHUB_REF_NAME}" \
              -o scanctx-alert/prism-alert ./cmd/prism-alert
      - name: build alert image for scanning
        run: docker build -f Dockerfile.alert.release -t prism-alert:scan scanctx-alert
      - name: trivy alert image scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.73.0
          image-ref: prism-alert:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library

  release:
    needs: scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history + tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache: true
      - uses: docker/setup-qemu-action@v3 # arm64 emulation on the amd64 runner
      - uses: docker/setup-buildx-action@v3
      - name: install arm64 cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - name: run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chart:
    needs: scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.1.4
      - name: log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: package and push charts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for chart in prism-store prism-alert; do
            sed -i "s/^version: .*/version: ${VERSION}/" "deploy/charts/${chart}/Chart.yaml"
            sed -i "s/^appVersion: .*/appVersion: ${GITHUB_REF_NAME}/" "deploy/charts/${chart}/Chart.yaml"
            helm package "deploy/charts/${chart}" --destination /tmp
            helm push "/tmp/${chart}-${VERSION}.tgz" oci://ghcr.io/prism-utils/charts
          done
