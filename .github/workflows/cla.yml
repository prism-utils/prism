name: CLA Assistant

# Signature check only — does not build or execute PR code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    steps:
      - name: CLA Assistant
        if: |
          (github.event.comment && (
            contains(github.event.comment.body, 'recheck') ||
            contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
          )) || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ASSISTANT_PAT || secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/prism-utils/prism/blob/main/CLA.md
          remote-organization-name: prism-utils
          remote-repository-name: cla-signatures
          branch: main
          path-to-signatures: signatures/prism/cla.json
          allowlist: bot*,dependabot[bot],github-actions[bot],maramos
          custom-notsigned-prcomment: >
            Thank you for your contribution. prism requires a signed Contributor
            License Agreement (CLA) before we can merge. Please read CLA.md and
            reply with exactly:

            I have read the CLA Document and I hereby sign the CLA
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
